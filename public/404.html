<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Alvia Yovas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Served by Vercel for any unknown path. Self-contained: no app bundle needed. -->
    <style>
      :root { --bg: #faf8f3; --fg: #1a1a1a; --muted: #6e675b; --accent: #b08d57; --card: #fffdf8; --border: #e6dfd0; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f0f0f; --fg: #f5f5f5; --muted: #a3a3a3; --accent: #c9a96e; --card: #161616; --border: #262626; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--fg);
        font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 30rem; text-align: center; }
      .code { font-size: 0.8rem; letter-spacing: 0.35em; color: var(--accent); text-transform: uppercase; }
      h1 { font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.1; letter-spacing: -0.03em; margin: 0.75rem 0 1rem; }
      p { color: var(--muted); margin: 0 0 2rem; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-width: 11rem;
        padding: 0.9rem 1.5rem; border-radius: 8px; font-weight: 500; text-decoration: none;
        border: 1px solid var(--border); color: var(--fg); background: var(--card);
      }
      a.primary { background: var(--fg); color: var(--bg); border-color: transparent; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404 · Not found</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be old or mistyped. Everything on this site lives on the home page.</p>
      <div class="actions">
        <a class="primary" href="/">Go to the home page</a>
        <a href="/#projects">See my projects</a>
      </div>
    </main>
  </body>
</html>
