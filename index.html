<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f3" />
    <!-- Apply the saved / system theme before first paint (mirrors hooks/useTheme.ts). -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').content = "#0f0f0f";
      })();
    </script>
    <title>Alvia Yovas | AI & Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Alvia Yovas, an AI & Full Stack Developer and Computer Science Engineering student building intelligent applications and modern digital experiences."
    />
    <meta name="author" content="Alvia Yovas S" />

    <link rel="canonical" href="https://www.alviayovas.in/" />

    <!-- Social crawlers ignore relative image URLs, so these must stay absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alvia Yovas" />
    <meta property="og:url" content="https://www.alviayovas.in/" />
    <meta property="og:title" content="Alvia Yovas | AI &amp; Full Stack Developer" />
    <meta
      property="og:description"
      content="AI & Full Stack Developer building intelligent applications, modern web experiences and practical tools."
    />
    <meta property="og:image" content="https://www.alviayovas.in/images/alvia-avatar.jpg" />
    <meta property="og:image:alt" content="Alvia Yovas — AI &amp; Full Stack Developer" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alvia Yovas | AI &amp; Full Stack Developer" />
    <meta
      name="twitter:description"
      content="AI & Full Stack Developer building intelligent applications, modern web experiences and practical tools."
    />
    <meta name="twitter:image" content="https://www.alviayovas.in/images/alvia-avatar.jpg" />

    <!--
      Person schema. Only fields that are verified elsewhere on the site are included —
      no job title inflation, no employer, no awards markup.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alvia Yovas S",
        "jobTitle": "AI & Full Stack Developer",
        "url": "https://www.alviayovas.in/",
        "image": "https://www.alviayovas.in/images/alvia-avatar.jpg",
        "email": "mailto:alviayovas@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Chennai", "addressCountry": "IN" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Jeppiaar Engineering College" },
        "sameAs": [
          "https://github.com/alviayovas-cell",
          "https://www.linkedin.com/in/alviayovas",
          "https://instagram.com/alvia_yovas"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
