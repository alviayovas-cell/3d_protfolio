<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Template: the __SITE_*__ tokens and the "content:jsonld" / "content:summary"
      markers are filled in from src/content/*.json by scripts/content-plugin.ts.
      Edit the content, not the generated parts of this file.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f3" />
    <!-- Apply the saved / system theme before first paint (mirrors hooks/useTheme.ts). -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').content = "#0f0f0f";
      })();
    </script>
    <title>__SITE_TITLE__</title>
    <meta
      name="description"
      content="Portfolio of Alvia Yovas, an AI & Full Stack Developer and Computer Science Engineering student building intelligent applications and modern digital experiences."
    />
    <meta name="author" content="__SITE_AUTHOR__" />

    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Social crawlers ignore relative image URLs, so these must stay absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alvia Yovas" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="__SITE_TITLE__" />
    <meta
      property="og:description"
      content="AI & Full Stack Developer building intelligent applications, modern web experiences and practical tools."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SITE_TITLE__" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_TITLE__" />
    <meta
      name="twitter:description"
      content="AI & Full Stack Developer building intelligent applications, modern web experiences and practical tools."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <!-- Person + WebSite structured data, generated from profile, education and skills. -->
    <!-- content:jsonld -->

    <style>
      /* The crawler summary below shows for a moment before React mounts; keep it calm. */
      .static-summary { max-width: 42rem; margin: 0 auto; padding: 6rem 1.5rem; font: 16px/1.6 system-ui, sans-serif; opacity: 0.85; }
      .static-summary h1 { font-size: 2rem; margin: 0 0 0.5rem; }
      .static-summary h2 { font-size: 1.1rem; margin: 2rem 0 0.5rem; }
      .static-summary a { color: inherit; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Static summary for crawlers that don't run JavaScript (and Google's first,
      pre-render pass), generated from src/content. React's createRoot replaces it on
      mount, so visitors only see it for a moment.
    -->
    <div id="root">
      <!-- content:summary -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
